<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart</title>
    <style>
        /* General Styles */
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to bottom, #ffafbd, #ffc3a0); /* Cute gradient for kids */
            color: #333;
            margin: 0;
            padding: 0;
        }
        h2 {
            color: #333;
            text-align: center;
            padding: 20px;
            font-size: 24px;
        }

        /* Cart Section */
        #cart {
            list-style-type: none;
            padding: 0;
            max-width: 600px;
            margin: 0 auto;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        #cart li {
            background-color: #f9f9f9;
            margin: 10px;
            padding: 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        button {
            background-color: #ff7f50;
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            border: none;
        }
        button:hover {
            background-color: #ff6347;
        }

        /* Review Section */
        #reviewList {
            padding: 0;
            margin-top: 20px;
            max-width: 600px;
            margin: 0 auto;
            list-style-type: none;
        }
        #reviewList li {
            background-color: #fff;
            padding: 8px;
            margin: 5px 0;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        /* Category Section */
        #categorySection {
            display: flex;
            justify-content: space-around;
            margin-top: 30px;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
        }
        .category {
            padding: 10px 20px;
            background-color: #ffebcd;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .category:hover {
            background-color: #ffcc99;
        }

        /* Image Upload */
        input[type="file"] {
            margin-top: 20px;
        }

        /* Security - XSS Prevention */
        input, textarea {
            border: 1px solid #ccc;
            padding: 10px;
            width: 100%;
            margin: 10px 0;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <!-- Cart Section -->
    <section>
        <h2>Your Cart</h2>
        <ul id="cart">
            <li>
                Pink Baby Dress - $19.99
                <button onclick="removeItem(this)">Remove</button>
            </li>
            <li>
                Blue Onesie - $14.99
                <button onclick="removeItem(this)">Remove</button>
            </li>
        </ul>
        <button onclick="placeOrder()">Place Order</button>
        <p id="orderStatus" style="color: green; text-align: center;"></p>
    </section>

    <!-- Review Section -->
    <section>
        <h2>Leave a Review</h2>
        <form onsubmit="addReview(event)">
            <input type="text" id="reviewInput" placeholder="Write your review..." required>
            <button type="submit">Submit</button>
        </form>
        <ul id="reviewList"></ul>
    </section>

    <!-- Category Section -->
    <section id="categorySection">
        <div class="category" onclick="addCategory('Toys')">Toys</div>
        <div class="category" onclick="addCategory('Clothes')">Clothes</div>
        <div class="category" onclick="addCategory('Books')">Books</div>
    </section>

    <!-- Image Upload Section -->
    <section>
        <h2>Upload Product Image</h2>
        <input type="file" id="imageInput" accept="image/*" onchange="previewImage()">
        <img id="imagePreview" src="" alt="Image preview" style="max-width: 300px; margin-top: 20px;">
    </section>

    <script>
        // Place Order Function
        function placeOrder() {
            document.getElementById("orderStatus").textContent = "✅ Your order has been placed!";
        }

        // Add Review Function
        function addReview(event) {
            event.preventDefault();
            const input = document.getElementById("reviewInput");
            const text = escapeHTML(input.value);
            const list = document.getElementById("reviewList");

            const li = document.createElement("li");
            li.innerText = text;
            list.appendChild(li);

            input.value = "";
        }

        // Remove Item from Cart
        function removeItem(button) {
            button.parentElement.remove();
        }

        // Add Category Function
        function addCategory(categoryName) {
            alert(`Category added: ${categoryName}`);
        }

        // Image Preview Function
        function previewImage() {
            const file = document.getElementById('imageInput').files[0];
            const reader = new FileReader();
            reader.onloadend = function() {
                document.getElementById('imagePreview').src = reader.result;
            }
            if (file) {
                reader.readAsDataURL(file);
            }
        }

        // Escape HTML to prevent XSS
        function escapeHTML(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }
    </script>

</body>
</html>
